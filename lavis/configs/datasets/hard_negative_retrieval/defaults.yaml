datasets:
  hard_negative_retrieval:
    data_type: images
    build_info:
      annotations:
        train:
          url: artifacts/hard-negative-train.jsonl
          storage: artifacts/hard-negative-train.jsonl
      images:
        storage: .
    vis_processor:
      train:
        name: "blip_image_train"
        image_size: 384
      eval:
        name: "blip_image_eval"
        image_size: 384
    text_processor:
      train:
        name: "blip_caption"
      eval:
        name: "blip_caption"
