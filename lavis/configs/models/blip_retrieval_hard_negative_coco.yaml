model:
  arch: blip_retrieval_hard_negative
  load_finetuned: True
  finetuned: "https://storage.googleapis.com/sfr-vision-language-research/LAVIS/models/BLIP/blip_coco_retrieval.pth"
  pretrained: "https://storage.googleapis.com/sfr-vision-language-research/BLIP/models/model_base_capfilt_large.pth"
  queue_size: 57600
  vit_type: "base"
  vit_grad_ckpt: True
  vit_ckpt_layer: 4
  image_size: 384
  med_config_path: "configs/models/med_config.json"
  embed_dim: 256
  hard_negative_margin: 0.2
  hard_negative_weight: 0.5

preprocess:
  vis_processor:
    train:
      name: "blip_image_train"
      image_size: 384
    eval:
      name: "blip_image_eval"
      image_size: 384
  text_processor:
    train:
      name: "blip_caption"
    eval:
      name: "blip_caption"
